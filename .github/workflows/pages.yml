# Documentation site (docs-site/, Astro Starlight).
#
# Builds on every PR so site breakage is caught pre-merge; deploys on
# push to main or manual dispatch when GitHub Pages is enabled
# (Settings -> Pages -> Source: GitHub Actions), so the job stays green
# while Pages is disabled. scripts/stage-docs-site.py copies every
# spec/<version>/ folder and spec/draft/ into the site at build time:
# one page per version, spec.md as the latest alias, each version's
# schemas at the path its $id names, and the navigation entries.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - name: Build site
        # Every bundle's schemas are published at the paths their $id
        # values name, so every $id dereferences: schema/v<X.Y>/ for a
        # release (byte-immutable) and schema/draft/ for the draft
        # (mutable).
        env:
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: |
          set -euo pipefail
          npm ci --prefix docs-site
          npm run build --prefix docs-site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether Pages is enabled
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled; skipping deploy."
          fi
      - name: Deploy to GitHub Pages
        if: steps.enabled.outputs.pages == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
